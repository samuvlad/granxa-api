services:
  db:
    image: postgis/postgis:15-3.4
    container_name: granxa-prod-db
    environment:
      POSTGRES_USER: granxa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: granxa_maps
    volumes:
      - granxa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granxa -d granxa_maps"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/samuvlad/granxa-api:master
    container_name: granxa-prod-api
    environment:
      DATABASE_URL: postgresql+psycopg2://granxa:${POSTGRES_PASSWORD}@db:5432/granxa_maps
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RUN_MIGRATIONS: "1"
      RELOAD: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: ghcr.io/samuvlad/granxa-web:master
    container_name: granxa-prod-web
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  granxa-db-data: